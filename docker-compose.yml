services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: f1-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - f1-network
    deploy:
      resources:
        limits:
          cpus: '${MYSQL_CPU_LIMIT}'
          memory: ${MYSQL_MEMORY_LIMIT}
        reservations:
          cpus: '${MYSQL_CPU_RESERVE}'
          memory: ${MYSQL_MEMORY_RESERVE}

  # Redis (Message Broker for Celery)
  redis:
    image: redis:7-alpine
    container_name: f1-cache
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - f1-network
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPU_LIMIT}'
          memory: ${REDIS_MEMORY_LIMIT}
        reservations:
          cpus: '${REDIS_CPU_RESERVE}'
          memory: ${REDIS_MEMORY_RESERVE}

  # Django Backend API
  django-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: f1-api
    entrypoint: ["/app/entrypoint.sh"]
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "${DJANGO_PORT}:8000"
    volumes:
      - ./backend:/app
      - fastf1-cache:/app/.fastf1_cache
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - DATABASE_ENGINE=${DATABASE_ENGINE}
      - DATABASE_NAME=${MYSQL_DATABASE}
      - DATABASE_USER=${MYSQL_USER}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - COLLECTION_EST_MB_PER_TASK=${COLLECTION_EST_MB_PER_TASK}
      - COLLECTION_SAFETY_MARGIN_MB=${COLLECTION_SAFETY_MARGIN_MB}
      - COLLECTION_MAX_PARALLEL=${COLLECTION_MAX_PARALLEL}
      - COLLECTION_DISPATCH_INTERVAL_SEC=${COLLECTION_DISPATCH_INTERVAL_SEC}
      - ML_N_JOBS=${ML_N_JOBS:-1}
      - ML_STACK_CV=${ML_STACK_CV:-3}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - f1-network
    deploy:
      resources:
        limits:
          cpus: '${DJANGO_CPU_LIMIT}'
          memory: ${DJANGO_MEMORY_LIMIT}
        reservations:
          cpus: '${DJANGO_CPU_RESERVE}'
          memory: ${DJANGO_MEMORY_RESERVE}

  # Celery Worker 1 - Generic Task Queue Worker
  celery-worker-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: f1-worker-1
    command: celery -A config worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY} --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD} --prefetch-multiplier=${CELERY_PREFETCH_MULTIPLIER} --hostname=worker1@%h
    volumes:
      - ./backend:/app
      - fastf1-cache:/app/.fastf1_cache
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_ENGINE=${DATABASE_ENGINE}
      - DATABASE_NAME=${MYSQL_DATABASE}
      - DATABASE_USER=${MYSQL_USER}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - COLLECTION_EST_MB_PER_TASK=${COLLECTION_EST_MB_PER_TASK}
      - COLLECTION_SAFETY_MARGIN_MB=${COLLECTION_SAFETY_MARGIN_MB}
      - COLLECTION_MAX_PARALLEL=${COLLECTION_MAX_PARALLEL}
      - COLLECTION_DISPATCH_INTERVAL_SEC=${COLLECTION_DISPATCH_INTERVAL_SEC}
      - ML_N_JOBS=${ML_N_JOBS:-1}
      - ML_STACK_CV=${ML_STACK_CV:-3}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      django-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/app/celery_health.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - f1-network
    deploy:
      resources:
        limits:
          cpus: '${CELERY_WORKER_CPU_LIMIT}'
          memory: ${CELERY_WORKER_MEMORY_LIMIT}
        reservations:
          cpus: '${CELERY_WORKER_CPU_RESERVE}'
          memory: ${CELERY_WORKER_MEMORY_RESERVE}

  # Celery Worker 2 - Generic Task Queue Worker
  celery-worker-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: f1-worker-2
    command: celery -A config worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY} --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD} --prefetch-multiplier=${CELERY_PREFETCH_MULTIPLIER} --hostname=worker2@%h
    volumes:
      - ./backend:/app
      - fastf1-cache:/app/.fastf1_cache
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_ENGINE=${DATABASE_ENGINE}
      - DATABASE_NAME=${MYSQL_DATABASE}
      - DATABASE_USER=${MYSQL_USER}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - COLLECTION_EST_MB_PER_TASK=${COLLECTION_EST_MB_PER_TASK}
      - COLLECTION_SAFETY_MARGIN_MB=${COLLECTION_SAFETY_MARGIN_MB}
      - COLLECTION_MAX_PARALLEL=${COLLECTION_MAX_PARALLEL}
      - COLLECTION_DISPATCH_INTERVAL_SEC=${COLLECTION_DISPATCH_INTERVAL_SEC}
      - ML_N_JOBS=${ML_N_JOBS:-1}
      - ML_STACK_CV=${ML_STACK_CV:-3}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      django-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/app/celery_health.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - f1-network
    deploy:
      resources:
        limits:
          cpus: '${CELERY_WORKER_CPU_LIMIT}'
          memory: ${CELERY_WORKER_MEMORY_LIMIT}
        reservations:
          cpus: '${CELERY_WORKER_CPU_RESERVE}'
          memory: ${CELERY_WORKER_MEMORY_RESERVE}

  # Celery Worker 3 - Generic Task Queue Worker
  celery-worker-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: f1-worker-3
    command: celery -A config worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY} --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD} --prefetch-multiplier=${CELERY_PREFETCH_MULTIPLIER} --hostname=worker3@%h
    volumes:
      - ./backend:/app
      - fastf1-cache:/app/.fastf1_cache
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_ENGINE=${DATABASE_ENGINE}
      - DATABASE_NAME=${MYSQL_DATABASE}
      - DATABASE_USER=${MYSQL_USER}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - COLLECTION_EST_MB_PER_TASK=${COLLECTION_EST_MB_PER_TASK}
      - COLLECTION_SAFETY_MARGIN_MB=${COLLECTION_SAFETY_MARGIN_MB}
      - COLLECTION_MAX_PARALLEL=${COLLECTION_MAX_PARALLEL}
      - COLLECTION_DISPATCH_INTERVAL_SEC=${COLLECTION_DISPATCH_INTERVAL_SEC}
      - ML_N_JOBS=${ML_N_JOBS:-1}
      - ML_STACK_CV=${ML_STACK_CV:-3}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      django-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/app/celery_health.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - f1-network
    deploy:
      resources:
        limits:
          cpus: '${CELERY_WORKER_CPU_LIMIT}'
          memory: ${CELERY_WORKER_MEMORY_LIMIT}
        reservations:
          cpus: '${CELERY_WORKER_CPU_RESERVE}'
          memory: ${CELERY_WORKER_MEMORY_RESERVE}

  # Celery Beat (Scheduled Tasks)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: f1-scheduler
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_ENGINE=${DATABASE_ENGINE}
      - DATABASE_NAME=${MYSQL_DATABASE}
      - DATABASE_USER=${MYSQL_USER}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - COLLECTION_EST_MB_PER_TASK=${COLLECTION_EST_MB_PER_TASK}
      - COLLECTION_SAFETY_MARGIN_MB=${COLLECTION_SAFETY_MARGIN_MB}
      - COLLECTION_MAX_PARALLEL=${COLLECTION_MAX_PARALLEL}
      - COLLECTION_DISPATCH_INTERVAL_SEC=${COLLECTION_DISPATCH_INTERVAL_SEC}
      - ML_N_JOBS=${ML_N_JOBS:-1}
      - ML_STACK_CV=${ML_STACK_CV:-3}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      django-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/app/celery_beat_health.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - f1-network
    deploy:
      resources:
        limits:
          cpus: '${CELERY_BEAT_CPU_LIMIT}'
          memory: ${CELERY_BEAT_MEMORY_LIMIT}
        reservations:
          cpus: '${CELERY_BEAT_CPU_RESERVE}'
          memory: ${CELERY_BEAT_MEMORY_RESERVE}

  # Frontend (React with Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: f1-web
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV}
      - VITE_API_URL=${VITE_API_URL}
      - VITE_DOCKER_ENV=${VITE_DOCKER_ENV}
    restart: unless-stopped
    depends_on:
      django-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - f1-network
    deploy:
      resources:
        limits:
          cpus: '${FRONTEND_CPU_LIMIT}'
          memory: ${FRONTEND_MEMORY_LIMIT}
        reservations:
          cpus: '${FRONTEND_CPU_RESERVE}'
          memory: ${FRONTEND_MEMORY_RESERVE}

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  fastf1-cache:
    driver: local

networks:
  f1-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"
