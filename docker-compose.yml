services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: f1-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-f1_database}
      MYSQL_USER: ${MYSQL_USER:-f1_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-f1_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - f1-network
    deploy:
      resources:
        limits:
          memory: ${MYSQL_MEMORY_LIMIT:-1536M}
        reservations:
          memory: ${MYSQL_MEMORY_RESERVE:-512M}

  # Redis (Message Broker for Celery)
  redis:
    image: redis:7-alpine
    container_name: f1-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - f1-network
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-512M}
        reservations:
          memory: ${REDIS_MEMORY_RESERVE:-256M}

  # Django Backend API
  django-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: f1-django-api
    entrypoint: ["/app/entrypoint.sh"]
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - fastf1-cache:/app/.fastf1_cache
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-development-key}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,django-api,f1-django-api,*}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8102,http://127.0.0.1:8102}
      - DATABASE_ENGINE=django.db.backends.mysql
      - DATABASE_NAME=${MYSQL_DATABASE:-f1_database}
      - DATABASE_USER=${MYSQL_USER:-f1_user}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-f1_password}
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - f1-network
    deploy:
      resources:
        limits:
          memory: ${DJANGO_MEMORY_LIMIT:-1G}
        reservations:
          memory: ${DJANGO_MEMORY_RESERVE:-512M}

  # Celery Worker 1 - General Tasks (Alta Concorrência)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: f1-celery-worker-1
    command: celery -A config worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-4} --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-50} --prefetch-multiplier=${CELERY_PREFETCH_MULTIPLIER:-2}
    volumes:
      - ./backend:/app
      - fastf1-cache:/app/.fastf1_cache
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-development-key}
      - DATABASE_ENGINE=django.db.backends.mysql
      - DATABASE_NAME=${MYSQL_DATABASE:-f1_database}
      - DATABASE_USER=${MYSQL_USER:-f1_user}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-f1_password}
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_WORKER_CONCURRENCY=${CELERY_WORKER_CONCURRENCY:-4}
      - CELERY_MAX_TASKS_PER_CHILD=${CELERY_MAX_TASKS_PER_CHILD:-50}
      - CELERY_PREFETCH_MULTIPLIER=${CELERY_PREFETCH_MULTIPLIER:-2}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      django-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/app/celery_health.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - f1-network
    deploy:
      resources:
        limits:
          cpus: '${CELERY_WORKER_CPU_LIMIT:-2.0}'
          memory: ${CELERY_WORKER_MEMORY_LIMIT:-1536M}
        reservations:
          cpus: '${CELERY_WORKER_CPU_RESERVE:-1.0}'
          memory: ${CELERY_WORKER_MEMORY_RESERVE:-768M}

  # Celery Worker 2 - Historical Data Collection (Dedicado para Scraping)
  celery-worker-historical:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: f1-celery-worker-historical
    command: celery -A config worker -l info --concurrency=${CELERY_WORKER_HISTORICAL_CONCURRENCY:-3} --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-50} --prefetch-multiplier=${CELERY_PREFETCH_MULTIPLIER:-2} -Q historical,celery
    volumes:
      - ./backend:/app
      - fastf1-cache:/app/.fastf1_cache
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-development-key}
      - DATABASE_ENGINE=django.db.backends.mysql
      - DATABASE_NAME=${MYSQL_DATABASE:-f1_database}
      - DATABASE_USER=${MYSQL_USER:-f1_user}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-f1_password}
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_WORKER_CONCURRENCY=${CELERY_WORKER_HISTORICAL_CONCURRENCY:-3}
      - CELERY_MAX_TASKS_PER_CHILD=${CELERY_MAX_TASKS_PER_CHILD:-50}
      - CELERY_PREFETCH_MULTIPLIER=${CELERY_PREFETCH_MULTIPLIER:-2}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      django-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/app/celery_health.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - f1-network
    deploy:
      resources:
        limits:
          cpus: '${CELERY_WORKER_HISTORICAL_CPU_LIMIT:-2.0}'
          memory: ${CELERY_WORKER_HISTORICAL_MEMORY_LIMIT:-1536M}
        reservations:
          cpus: '${CELERY_WORKER_HISTORICAL_CPU_RESERVE:-1.0}'
          memory: ${CELERY_WORKER_HISTORICAL_MEMORY_RESERVE:-768M}

  # Celery Worker 3 - FastF1 Data Collection (Dedicado para FastF1)
  celery-worker-fastf1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: f1-celery-worker-fastf1
    command: celery -A config worker -l info --concurrency=${CELERY_WORKER_FASTF1_CONCURRENCY:-3} --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-50} --prefetch-multiplier=${CELERY_PREFETCH_MULTIPLIER:-2} -Q fastf1,celery
    volumes:
      - ./backend:/app
      - fastf1-cache:/app/.fastf1_cache
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-development-key}
      - DATABASE_ENGINE=django.db.backends.mysql
      - DATABASE_NAME=${MYSQL_DATABASE:-f1_database}
      - DATABASE_USER=${MYSQL_USER:-f1_user}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-f1_password}
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_WORKER_CONCURRENCY=${CELERY_WORKER_FASTF1_CONCURRENCY:-3}
      - CELERY_MAX_TASKS_PER_CHILD=${CELERY_MAX_TASKS_PER_CHILD:-50}
      - CELERY_PREFETCH_MULTIPLIER=${CELERY_PREFETCH_MULTIPLIER:-2}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      django-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/app/celery_health.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - f1-network
    deploy:
      resources:
        limits:
          cpus: '${CELERY_WORKER_FASTF1_CPU_LIMIT:-2.0}'
          memory: ${CELERY_WORKER_FASTF1_MEMORY_LIMIT:-1536M}
        reservations:
          cpus: '${CELERY_WORKER_FASTF1_CPU_RESERVE:-1.0}'
          memory: ${CELERY_WORKER_FASTF1_MEMORY_RESERVE:-768M}

  # Celery Beat (Scheduled Tasks)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: f1-celery-beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-development-key}
      - DATABASE_ENGINE=django.db.backends.mysql
      - DATABASE_NAME=${MYSQL_DATABASE:-f1_database}
      - DATABASE_USER=${MYSQL_USER:-f1_user}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-f1_password}
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      django-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/app/celery_beat_health.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - f1-network
    deploy:
      resources:
        limits:
          memory: ${CELERY_BEAT_MEMORY_LIMIT:-256M}
        reservations:
          memory: ${CELERY_BEAT_MEMORY_RESERVE:-128M}

  # Frontend (React with Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    container_name: f1-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      django-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - f1-network
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEMORY_LIMIT:-256M}
        reservations:
          memory: ${FRONTEND_MEMORY_RESERVE:-128M}

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  fastf1-cache:
    driver: local

networks:
  f1-network:
    driver: bridge
    # Configuração para acesso externo (VPS)
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"
